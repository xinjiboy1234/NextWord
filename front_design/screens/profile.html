<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>Profile · NextWord</title>
<link rel="stylesheet" href="../css/tokens.css" /><link rel="stylesheet" href="../css/app.css" />
<style>
  .profile-header {
    display:flex; align-items:center; gap:var(--space-6);
    padding:var(--space-6) 0;
    border-bottom:1px solid var(--border);
    margin-bottom:var(--space-6);
  }
  .profile-avatar-lg {
    width:80px; height:80px; border-radius:50%;
    background:var(--fg); color:var(--bg);
    display:grid; place-items:center;
    font-family:var(--font-display); font-size:var(--text-2xl); font-weight:700;
    flex-shrink:0;
  }
  .more-cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:var(--space-4); }
  .config-field { display:flex; flex-direction:column; gap:4px; margin-bottom:var(--space-3); }
  .config-field label { font-size:var(--text-sm); color:var(--muted); }
  @media (max-width:500px) { .profile-header { flex-direction:column; text-align:center; } }
</style></head>
<body>

<div class="app-shell"><div class="main-area" style="margin-left:0;">
<header class="topbar"><a href="../index.html" class="btn btn-ghost btn-sm">← Dashboard</a><span class="topbar-greeting" style="margin-left:auto;">Profile</span></header>
<main class="content">

<div class="profile-header">
  <div class="profile-avatar-lg">Y</div>
  <div style="flex:1;min-width:0;">
    <p style="font-family:var(--font-display);font-size:var(--text-xl);font-weight:700;">You</p>
    <p style="color:var(--muted);font-size:var(--text-sm);">you@example.com</p>
    <div style="display:flex;gap:var(--space-2);margin-top:var(--space-2);flex-wrap:wrap;">
      <span class="badge badge-fg">B1 · Intermediate</span>
      <span class="badge badge-info">Upgrade candidate</span>
    </div>
  </div>
  <button class="btn btn-secondary btn-sm" style="color:var(--danger);border-color:var(--danger);">Log out</button>
</div>

<div class="section-header"><h2>Learning Stats</h2></div>
<div class="stat-grid" style="margin-bottom:var(--space-8);">
  <div class="stat-item"><div class="stat-num">847</div><div class="stat-desc">Words learned</div></div>
  <div class="stat-item"><div class="stat-num">23</div><div class="stat-desc">Due for review</div></div>
  <div class="stat-item"><div class="stat-num">78%</div><div class="stat-desc">Accuracy</div></div>
  <div class="stat-item"><div class="stat-num">12</div><div class="stat-desc">Day streak</div></div>
</div>


</main></div></div>

<nav class="bottombar"><div class="bottombar-inner">
  <button class="bottombar-tab" onclick="window.location.href='../index.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Learn</button>
  <button class="bottombar-tab" onclick="window.location.href='spelling.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="8"/></svg>Practice</button>
  <button class="bottombar-tab" onclick="window.location.href='article-library.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>Read</button>
  <button class="bottombar-tab active" onclick="window.location.href='profile.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</button>
</div></nav>


</body></html>
